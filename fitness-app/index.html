<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Check Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <header>
            <h1>Fitness Check <span class="accent">Pro</span></h1>
            <p>Track your health metrics instantly</p>
        </header>

        <main>
            <!-- BMI Section -->
            <section class="card" id="bmi-section">
                <h2>BMI Calculator</h2>
                <div class="input-group">
                    <label for="height">Height (cm)</label>
                    <input type="number" id="height" placeholder="175">
                </div>
                <div class="input-group">
                    <label for="weight">Weight (kg)</label>
                    <input type="number" id="weight" placeholder="70">
                </div>
                <button id="calculate-bmi-btn" class="primary-btn">Calculate BMI</button>
                <div id="bmi-result" class="result hidden">
                    <span class="value">--</span>
                    <span class="category"></span>
                </div>
            </section>

            <!-- Water Section -->
            <section class="card" id="water-section">
                <h2>Daily Water Goal</h2>
                <div class="info-text">Based on your weight</div>
                <div id="water-result" class="result">
                    <span class="value">--</span> Liters
                </div>
            </section>

            <!-- Fitness Level -->
            <section class="card" id="fitness-section">
                <h2>Quick Fitness Test</h2>
                <div class="input-group">
                    <label for="pushups">Max Pushups</label>
                    <input type="number" id="pushups" placeholder="20">
                </div>
                <button id="check-fitness-btn" class="secondary-btn">Check Level</button>
                <div id="fitness-result" class="result hidden">
                    <span class="value">--</span>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
